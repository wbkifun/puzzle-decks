<g transform="translate(630,90)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="20" font-weight="700" fill="#111111">소금물 400g</text></g>
<g transform="translate(630,314)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="21" font-weight="700" fill="#111111">소금 70g</text></g>
<g transform="translate(760,180)"><text x="0" y="0" text-anchor="start" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="22" font-weight="700" fill="#111111">농도 = 70 ÷ 400</text></g>
<g transform="translate(760,216)"><text x="0" y="0" text-anchor="start" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="24" font-weight="700" fill="#111111">= 17.5%</text></g>
<g transform="translate(760,262)"><text x="0" y="0" text-anchor="start" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="19" font-weight="400" fill="#111111">(10+40)÷2 = 25%는</text></g>
<g transform="translate(760,288)"><text x="0" y="0" text-anchor="start" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="19" font-weight="400" fill="#111111">양이 같을 때만 맞는다</text></g>
<g transform="translate(500,386)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="22" fill="#111111"><tspan x="0" dy="0">%는 더하거나 평균 낼 수 없다 - 본체(소금 g)는 더할 수 있다</tspan></text></g>
