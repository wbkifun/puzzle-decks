<g transform="translate(245,200)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="34" font-weight="700" fill="#111111">+</text></g>
<g transform="translate(355,84)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="20" font-weight="700" fill="#111111">100g의 40%</text></g>
<rect x="300" y="210" width="110" height="24" fill="#e4e4e4"/>
