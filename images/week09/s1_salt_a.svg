<g transform="translate(355,284)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="21" font-weight="700" fill="#111111">소금 40g</text></g>
<line x1="450" y1="192" x2="520.0" y2="192.0" stroke="#111111" stroke-width="2.4"/>
<polygon points="530,192 515.0,199.0 515.0,185.0" fill="#111111"/>
<rect x="545" y="152" width="170" height="106" fill="#e4e4e4"/>
<rect x="545" y="258" width="170" height="22" fill="#111111"/>
