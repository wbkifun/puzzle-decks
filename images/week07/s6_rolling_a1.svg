<g transform="translate(500,130)"><text x="0" y="0" text-anchor="start" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="22" font-weight="700" fill="#111111">중심이 그리는 원의 반지름 = 2r</text></g>
<g transform="translate(500,168)"><text x="0" y="0" text-anchor="start" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="21" font-weight="400" fill="#111111">중심 이동 거리 = 2π×(2r) = 4πr</text></g>
<g transform="translate(500,206)"><text x="0" y="0" text-anchor="start" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="22" font-weight="700" fill="#111111">회전수 = 4πr ÷ 2πr = 2바퀴</text></g>
<g transform="translate(410,372)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="22" fill="#111111"><tspan x="0" dy="0">회전수는 접촉면이 스친 거리가 아니라 - 중심이 움직인 거리가 정한다</tspan></text></g>
