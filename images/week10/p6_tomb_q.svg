<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 510" width="660" height="510">
<path d="M 100.0 390 L 100.0 130 Q 100.0 60 330 60 Q 560.0 60 560.0 130 L 560.0 390 Z" fill="#ffffff" stroke="#111111" stroke-width="3"/>
<rect x="66.0" y="390" width="528" height="26" fill="#e4e4e4" stroke="#111111" stroke-width="2.4"/>
<g transform="translate(330,124)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="21" font-weight="700" fill="#111111">여기 디오판토스 잠들다</text></g>
<g transform="translate(330,162)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="18" font-weight="400" fill="#111111">인생의 1/6은 소년이었고</text></g>
<g transform="translate(330,200)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="18" font-weight="400" fill="#111111">다시 1/12이 지나 수염이 났으며</text></g>
<g transform="translate(330,238)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="18" font-weight="400" fill="#111111">다시 1/7이 지나 결혼하였다</text></g>
<g transform="translate(330,276)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="18" font-weight="400" fill="#111111">5년 뒤 아들을 얻었으나</text></g>
<g transform="translate(330,314)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="18" font-weight="400" fill="#111111">아들은 아버지 인생의 절반만 살았고</text></g>
<g transform="translate(330,352)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="18" font-weight="400" fill="#111111">아들을 보내고 4년 뒤 그도 잠들었다</text></g>
<g transform="translate(330,468)"><text x="0" y="0" text-anchor="middle" font-family="Pretendard, 'NanumSquareRound', sans-serif" font-size="22" fill="#111111"><tspan x="0" dy="0">디오판토스는 몇 살까지 살았을까?</tspan></text></g>
</svg>
